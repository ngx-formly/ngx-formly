<form [formGroup]="form" (ngSubmit)="submit()">
  <p>First name: {{ firstName$ | async }}</p>
  <formly-form
    [model]="model"
    [fields]="fields"
    [options]="options"
    [form]="form"
    (fieldChange)="onFieldChange($event)"
  ></formly-form>
  <button type="submit" class="btn btn-primary submit-button">Submit</button>
</form>
