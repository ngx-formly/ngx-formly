name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install npm
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundlesize
        run: npx bundlesize

      - name: Lint & Format
        run: |
          npm run format
          npm run lint

      - name: Test
        run: npm run test

      - name: Bundlesize
        run: npx bundlesize

      - name: E2E Test
        run: npm run e2e:ssr
